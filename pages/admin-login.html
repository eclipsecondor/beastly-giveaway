<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>

  <style>
    body{
      background:#0b0b0b;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:350px;
      background:#111;
      padding:30px;
      border-radius:12px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      margin-bottom:20px;
      border:none;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      background:#00ffcc;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    #status{
      margin-top:15px;
      color:#ff6666;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Admin Login</h2>

  <input
    type="password"
    id="adminPassword"
    placeholder="Enter password"
  >

  <button id="loginBtn">
    Login
  </button>

  <p id="status"></p>

</div>

<script src="../js/admin-login.js"></script>

</body>
</html>
